version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: gambling_bot_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-gambling_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gambling_password}
      POSTGRES_DB: ${DB_NAME:-gambling_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gambling_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - gambling_network

  # Redis для FSM и кэша
  redis:
    image: redis:7-alpine
    container_name: gambling_bot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - gambling_network

  # Основной бот приложение
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gambling_bot_app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-gambling_user}:${DB_PASSWORD:-gambling_password}@postgres:5432/${DB_NAME:-gambling_bot}
      REDIS_URL: redis://redis:6379/0
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      CASINO_LINK_1: ${CASINO_LINK_1:-https://1win.uz}
      CASINO_LINK_2: ${CASINO_LINK_2:-https://vavada.uz}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "80:8000"
      - "443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./app:/app/app
      - ./certs:/app/certs
    restart: always
    networks:
      - gambling_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Cloudflare Tunnel для webhook
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gambling_bot_cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiYzgxODJlOGU4NzYwMWRlNzIxMjRiNmQzNmQyMGNlMDciLCJ0IjoiYWE1MGNhMWItNjE0ZC00MjYzLWEzYzctYmZjNzVlMTFkY2U1IiwicyI6Ik1UZ3lPR1pqWm1VdFpEUXlPUzAwT1RWaExUZ3paV1V0TUdZd016UTFNMkl4WmpReSJ9
    restart: always
    networks:
      - gambling_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gambling_network:
    driver: bridge
